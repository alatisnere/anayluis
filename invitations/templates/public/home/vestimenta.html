{% load static %}
<section
        id="vestimenta"
        class="relative scroll-mt-28 bg-brand-cream overflow-hidden"
>
    <div class="relative mx-auto max-w-6xl px-4 sm:px-6 py-16 sm:py-20 text-center">
        <div class="title-box mb-10 reveal">
            <img
                    src="{% static 'invitations/images/titles/vestimenta.webp' %}"
                    alt="Código de vestimenta"
                    class="title-img opacity-95 select-none"
                    style="--title-scale: 1.20;"
                    loading="lazy"
                    decoding="async"
            />
        </div>

        <div class="relative mt-12">
            <div
                    class="absolute inset-y-0 left-1/2 w-px bg-brand-blue/25
                       -translate-x-1/2 pointer-events-none"
            ></div>

            <div class="grid grid-cols-2 gap-6 sm:gap-10 text-brand-blue/70 items-stretch">
                <div
                        class="text-center flex flex-col items-center justify-end h-full reveal"
                        data-delay="120"
                >
                    <img
                            src="{% static 'invitations/images/texts/vestimenta_hombre.webp' %}"
                            alt="Hombres - Traje - Corbata / Moño"
                            class="opacity-95 select-none w-[120px] sm:w-[150px] md:w-[180px] max-w-full h-auto mb-4 sm:mb-6"
                            loading="lazy"
                            decoding="async"
                    />

                    <a
                            href="https://www.pinterest.com/search/pins/?q=traje%20boda%20jard%C3%ADn%20hombre"
                            target="_blank"
                            class="inline-flex items-center justify-center rounded-full
                               w-full sm:w-auto
                               max-w-[220px] sm:max-w-none
                               px-6 sm:px-12 py-3
                               text-[10px] sm:text-[11px]
                               tracking-[.3em] uppercase
                               bg-brand-blue text-white hover:opacity-90
                               font-ansam"
                    >
                        Ver moodboard
                    </a>
                </div>

                <div
                        class="text-center flex flex-col items-center justify-end h-full reveal"
                        data-delay="240"
                >
                    <img
                            src="{% static 'invitations/images/texts/vestimenta_mujer.webp' %}"
                            alt="Mujeres - Vestido largo - Coctel"
                            class="opacity-95 select-none w-[120px] sm:w-[150px] md:w-[180px] max-w-full h-auto mb-4 sm:mb-6"
                            loading="lazy"
                            decoding="async"
                    />

                    <a
                            href="https://www.pinterest.com/search/pins/?q=vestido%20largo%20invitada%20boda"
                            target="_blank"
                            class="inline-flex items-center justify-center rounded-full
                               w-full sm:w-auto
                               max-w-[220px] sm:max-w-none
                               px-6 sm:px-12 py-3
                               text-[10px] sm:text-[11px]
                               tracking-[.3em] uppercase
                               bg-brand-blue text-white hover:opacity-90
                               font-ansam"
                    >
                        Ver moodboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
