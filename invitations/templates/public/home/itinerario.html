{% load static %}
<section id="itinerario" class="relative scroll-mt-28 bg-brand-cream overflow-hidden">
    <div class="paper-leaves-left"></div>

    <div class="relative z-10 mx-auto max-w-6xl px-4 sm:px-6 py-12 sm:py-20">
        <div class="title-box mb-8 sm:mb-12 reveal">
            <img
                    src="{% static 'invitations/images/titles/itinerario.webp' %}"
                    alt="Itinerario"
                    class="title-img opacity-95 select-none"
                    style="--title-scale: 0.40;"
                    loading="lazy"
                    decoding="async"
            />
        </div>

        <div class="mt-10 sm:mt-14 grid grid-cols-2 lg:grid-cols-4 gap-10 text-center">
            <div class="px-2 reveal" data-delay="0">
                <img
                        src="{% static 'invitations/images/icons/it_iglesia.webp' %}"
                        alt="Ceremonia religiosa"
                        class="mx-auto h-24 sm:h-28 w-auto opacity-95"
                        loading="lazy"
                        decoding="async"
                />

                <div class="mt-5 text-[15px] font-abhaya text-brand-blue leading-snug">
                    Ceremonia Religiosa
                    <span class="block sm:inline">3:00 PM</span>
                </div>

                <div class="mt-1 text-[14px] font-abhaya text-brand-blue/70">
                    Parroquia de Santa Clara
                </div>

                <a
                        href="https://www.google.com/maps/search/?api=1&query=Tepoztl%C3%A1n%2C%20Morelos"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mt-6 sm:mt-7 inline-flex items-center justify-center rounded-full
                           px-7 sm:px-12 py-3
                           text-[11px] tracking-[.3em] uppercase
                           bg-brand-blue text-white hover:opacity-90
                           font-ansam"
                >
                    Ubicación
                </a>
            </div>

            <div class="px-2 reveal" data-delay="90">
                <img
                        src="{% static 'invitations/images/icons/it_civil.webp' %}"
                        alt="Ceremonia civil"
                        class="mx-auto h-24 sm:h-28 w-auto opacity-95"
                        loading="lazy"
                        decoding="async"
                />

                <div class="mt-5 text-[15px] font-abhaya text-brand-blue leading-snug">
                    Ceremonia Civil
                    <span class="block sm:inline">5:00 PM</span>
                </div>

                <div class="mt-1 text-[14px] font-abhaya text-brand-blue/70">
                    Hacienda Los Cipreses
                </div>

                <a
                        href="https://www.google.com/maps/search/?api=1&query=Tepoztl%C3%A1n%2C%20Morelos"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mt-6 sm:mt-7 inline-flex items-center justify-center rounded-full
                           px-7 sm:px-12 py-3
                           text-[11px] tracking-[.3em] uppercase
                           bg-brand-blue text-white hover:opacity-90
                           font-ansam"
                >
                    Ubicación
                </a>
            </div>

            <div class="px-2 reveal" data-delay="180">
                <img
                        src="{% static 'invitations/images/icons/it_cocktail.webp' %}"
                        alt="Cocktail"
                        class="mx-auto h-24 sm:h-28 w-auto opacity-95"
                        loading="lazy"
                        decoding="async"
                />

                <div class="mt-5 text-[15px] font-abhaya text-brand-blue leading-snug">
                    Cocktail
                    <span class="block sm:inline">6:00 PM</span>
                </div>

                <div class="mt-1 text-[14px] font-abhaya text-brand-blue/70">
                    Hacienda Los Cipreses
                </div>

                <a
                        href="https://www.google.com/maps/search/?api=1&query=Tepoztl%C3%A1n%2C%20Morelos"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mt-6 sm:mt-7 inline-flex items-center justify-center rounded-full
                           px-7 sm:px-12 py-3

                           bg-brand-blue text-white hover:opacity-90
                           font-ansam"
                >
                    Ubicación
                </a>
            </div>

            <div class="px-2 reveal" data-delay="270">
                <img
                        src="{% static 'invitations/images/icons/it_recepcion.webp' %}"
                        alt="Recepción"
                        class="mx-auto h-24 sm:h-28 w-auto opacity-95"
                        loading="lazy"
                        decoding="async"
                />

                <div class="mt-5 text-[15px] font-abhaya text-brand-blue leading-snug">
                    Recepción
                    <span class="block sm:inline">7:00 PM</span>
                </div>

                <div class="mt-1 text-[14px] font-abhaya text-brand-blue/70">
                    Hacienda Los Cipreses
                </div>

                <a
                        href="https://www.google.com/maps/search/?api=1&query=Tepoztl%C3%A1n%2C%20Morelos"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="mt-6 sm:mt-7 inline-flex items-center justify-center rounded-full
                           px-7 sm:px-12 py-3
                           text-[11px] tracking-[.3em] uppercase
                           bg-brand-blue text-white hover:opacity-90
                           font-ansam"
                >
                    Ubicación
                </a>
            </div>
        </div>
    </div>
</section>
